<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="作業清單">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>每日作業進度表</title>
<style>
:root{
  --bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;
  --blue:#2563eb;--blue-soft:#dbeafe;--green:#16a34a;--green-soft:#dcfce7;
  --yellow:#f59e0b;--yellow-soft:#fef3c7;--red:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"SF Pro Text","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{border:0;border-radius:14px;font-weight:800;cursor:pointer}
.app{max-width:1000px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:30px;margin:0}
.date{color:var(--muted);margin-top:5px}
.mode-pill{padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:14px}
.grid{display:grid;grid-template-columns:1.3fr .7fr .8fr;gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.label{font-size:13px;font-weight:800;color:var(--muted)}
.metric{font-size:30px;font-weight:900;margin-top:4px}
.progress{height:16px;border-radius:999px;background:#edf1f7;overflow:hidden;margin-top:12px}
.progress > div{height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);width:0%;transition:.25s}
.focus{border:2px solid var(--blue);background:linear-gradient(180deg,#fff,#f7fbff);margin-bottom:14px;text-align:center;padding:26px}
.focus-kicker{font-size:13px;color:var(--blue);font-weight:900}
.focus-task{font-size:34px;font-weight:900;margin:10px 0 8px}
.focus-meta{font-size:17px;color:var(--muted);margin-bottom:18px}
.timer{font-size:42px;font-variant-numeric:tabular-nums;font-weight:900;margin:10px 0 18px}
.bigbtn{min-width:220px;padding:16px 24px;font-size:22px;background:var(--blue);color:#fff}
.bigbtn.finish{background:var(--green)}
.encourage{font-size:18px;font-weight:800;color:var(--green);min-height:28px;margin-top:14px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 15px}
.item.current{border:2px solid var(--blue);background:var(--blue-soft)}
.item.done{opacity:.72}
.order{width:38px;height:38px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-weight:900}
.item-title{font-size:18px;font-weight:850}
.item-sub{font-size:13px;color:var(--muted);margin-top:3px}
.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#f3f4f6;color:#4b5563}
.badge.doing{background:var(--yellow-soft);color:#92400e}.badge.done{background:var(--green-soft);color:#166534}
.parent-only{display:none}
body.parent .parent-only{display:block}
.parent-panel{margin-top:16px}
.parent-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.smallbtn{padding:10px 12px;background:#fff;border:1px solid var(--line)}
.danger{color:var(--red)}
.editrow{display:grid;grid-template-columns:44px 1fr 110px 92px 132px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.editrow:last-child{border-bottom:0}
.editrow input{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}
.rowbtns{display:flex;gap:5px}
.rowbtns button{padding:8px 9px;background:#f3f4f6}
.empty{color:var(--muted);text-align:center;padding:18px}
.modalback{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modalback.show{display:flex}
.modal{width:min(420px,100%);background:#fff;border-radius:22px;padding:22px}
.modal h3{margin:0 0 8px}.modal p{color:var(--muted);margin-top:0}
.pin{width:100%;font-size:28px;letter-spacing:.25em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.complete-screen{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#eff6ff,#f0fdf4);z-index:80;align-items:center;justify-content:center;text-align:center;padding:24px}
.complete-screen.show{display:flex}
.complete-inner{max-width:520px}
.complete-icon{font-size:86px}.complete-title{font-size:40px;font-weight:950;margin:10px 0}.complete-sub{font-size:20px;color:var(--muted);margin-bottom:22px}
@media(max-width:760px){
  .app{padding-left:12px;padding-right:12px}
  h1{font-size:25px}.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}
  .focus{padding:22px 14px}.focus-task{font-size:31px}.timer{font-size:38px}.bigbtn{width:100%;min-width:0}
  .item{grid-template-columns:42px 1fr auto}.item-title{font-size:17px}
  .editrow{grid-template-columns:36px 1fr 82px;grid-template-areas:"n name min" "n controls controls"}
  .editrow .n{grid-area:n}.editrow .nm{grid-area:name}.editrow .mi{grid-area:min}.editrow .rowbtns{grid-area:controls}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>📚 每日作業進度表</h1>
      <div class="date" id="dateText"></div>
    </div>
    <button class="mode-pill" id="modeBtn" onclick="requestParent()">👦 小朋友模式</button>
  </header>

  <section class="grid">
    <div class="card wide">
      <div class="label">今日進度</div>
      <div class="metric"><span id="doneCount">0</span> / <span id="totalCount">0</span> 完成</div>
      <div class="progress"><div id="bar"></div></div>
    </div>
    <div class="card">
      <div class="label">完成比例</div>
      <div class="metric" id="pct">0%</div>
    </div>
    <div class="card">
      <div class="label">預計剩餘</div>
      <div class="metric"><span id="remain">0</span> 分</div>
    </div>
  </section>

  <section class="card focus">
    <div class="focus-kicker">🎯 現在只做這一件</div>
    <div class="focus-task" id="focusTask">今天的作業都完成了！</div>
    <div class="focus-meta" id="focusMeta">可以休息囉 🎉</div>
    <div class="timer" id="timer" style="display:none">00:00</div>
    <button class="bigbtn" id="startBtn" onclick="startCurrent()">▶ 開始</button>
    <button class="bigbtn finish" id="finishBtn" style="display:none" onclick="finishCurrent()">✓ 完成</button>
    <div class="encourage" id="encourage"></div>
  </section>

  <section class="list" id="kidList"></section>

  <section class="card parent-panel parent-only">
    <div class="label" style="margin-bottom:10px">⚙️ 家長設定</div>
    <div class="parent-toolbar">
      <button class="smallbtn" onclick="addTask()">＋ 新增作業</button>
      <button class="smallbtn" onclick="changePin()">修改家長 PIN</button>
      <button class="smallbtn" onclick="newDay()">建立新的一天</button>
      <button class="smallbtn danger" onclick="resetToday()">清除今日紀錄</button>
      <button class="smallbtn" onclick="exitParent()">回小朋友模式</button>
    </div>
    <div id="editor"></div>
  </section>
</div>

<div class="modalback" id="pinModal">
  <div class="modal">
    <h3 id="pinTitle">家長模式</h3>
    <p id="pinDesc">輸入 4 位數 PIN。預設為 1234。</p>
    <input class="pin" id="pinInput" inputmode="numeric" maxlength="4" pattern="[0-9]*">
    <div class="modal-actions">
      <button class="smallbtn" onclick="closePin()">取消</button>
      <button class="smallbtn" style="background:var(--blue);color:#fff" onclick="confirmPin()">確定</button>
    </div>
  </div>
</div>

<div class="complete-screen" id="completeScreen">
  <div class="complete-inner">
    <div class="complete-icon">🎉</div>
    <div class="complete-title">今天全部完成！</div>
    <div class="complete-sub" id="completeSub">做得很好，可以休息了。</div>
    <button class="bigbtn" onclick="closeComplete()">太棒了！</button>
  </div>
</div>

<script>
const KEY="homework-pwa-data-v2";
const PINKEY="homework-pwa-pin-v1";
let timerHandle=null;
let parentMode=false;
let pinAction="enter";

const defaultTasks=[
  {name:"甲本",plan:30,actual:null,done:false,startedAt:null},
  {name:"乙本",plan:30,actual:null,done:false,startedAt:null},
  {name:"圈詞",plan:30,actual:null,done:false,startedAt:null},
  {name:"國習",plan:30,actual:null,done:false,startedAt:null},
  {name:"國筆",plan:30,actual:null,done:false,startedAt:null},
  {name:"數重",plan:30,actual:null,done:false,startedAt:null},
  {name:"數習",plan:30,actual:null,done:false,startedAt:null},
  {name:"國小考",plan:30,actual:null,done:false,startedAt:null},
  {name:"數小考",plan:30,actual:null,done:false,startedAt:null},
  {name:"MyOn",plan:30,actual:null,done:false,startedAt:null},
  {name:"FET Vol Workbook",plan:20,actual:null,done:false,startedAt:null},
  {name:"FET CS Workbook",plan:20,actual:null,done:false,startedAt:null},
  {name:"FET Quiz",plan:30,actual:null,done:false,startedAt:null},
  {name:"CET Conventions",plan:20,actual:null,done:false,startedAt:null},
  {name:"CET Vol Online",plan:20,actual:null,done:false,startedAt:null},
  {name:"CET Quiz",plan:30,actual:null,done:false,startedAt:null}
];
let tasks=load() || structuredClone(defaultTasks);

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function getPin(){return localStorage.getItem(PINKEY)||"1234"}
function dayText(){
  return new Intl.DateTimeFormat("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
}
document.getElementById("dateText").textContent=dayText();

function curIndex(){
  const running=tasks.findIndex(t=>!t.done && t.startedAt);
  if(running>=0) return running;
  return tasks.findIndex(t=>!t.done);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function render(){
  save();
  const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;
  document.getElementById("doneCount").textContent=done;
  document.getElementById("totalCount").textContent=total;
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("remain").textContent=tasks.filter(t=>!t.done).reduce((a,t)=>a+(Number(t.plan)||0),0);

  const ci=curIndex();
  const kid=document.getElementById("kidList");
  kid.innerHTML="";
  if(!tasks.length) kid.innerHTML='<div class="empty">還沒有作業，請家長先新增。</div>';

  tasks.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="item"+(t.done?" done":"")+(i===ci&&!t.done?" current":"");
    const st=t.done?"已完成":t.startedAt?"進行中":"未開始";
    const cls=t.done?"done":t.startedAt?"doing":"";
    const actual=t.actual==null?"":` · 實際 ${t.actual} 分鐘`;
    d.innerHTML=`<div class="order">${i+1}</div>
      <div><div class="item-title">${esc(t.name)}</div>
      <div class="item-sub">預計 ${t.plan} 分鐘${actual}</div></div>
      <div class="badge ${cls}">${st}</div>`;
    kid.appendChild(d);
  });

  const focusTask=document.getElementById("focusTask"),focusMeta=document.getElementById("focusMeta");
  const start=document.getElementById("startBtn"),finish=document.getElementById("finishBtn"),timer=document.getElementById("timer");
  if(ci<0){
    focusTask.textContent=tasks.length?"今天的作業都完成了！":"還沒有作業";
    focusMeta.textContent=tasks.length?"可以休息囉 🎉":"請家長先新增作業";
    start.style.display="none";finish.style.display="none";timer.style.display="none";stopTimer();
  }else{
    const t=tasks[ci];
    focusTask.textContent=`${ci+1}. ${t.name}`;
    focusMeta.textContent=`預計 ${t.plan} 分鐘 · 完成後還有 ${tasks.filter((x,j)=>!x.done&&j!==ci).length} 項`;
    start.style.display=t.startedAt?"none":"inline-block";
    finish.style.display=t.startedAt?"inline-block":"none";
    timer.style.display=t.startedAt?"block":"none";
    if(t.startedAt) startTimer(); else {stopTimer();timer.textContent="00:00";}
  }
  renderEditor();
}
function renderEditor(){
  const ed=document.getElementById("editor");ed.innerHTML="";
  tasks.forEach((t,i)=>{
    const row=document.createElement("div");row.className="editrow";
    row.innerHTML=`<div class="n order">${i+1}</div>
      <input class="nm" value="${esc(t.name)}" onchange="editName(${i},this.value)">
      <input class="mi" type="number" min="1" max="180" value="${t.plan}" onchange="editPlan(${i},this.value)">
      <div class="rowbtns">
        <button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button>
        <button onclick="toggleDone(${i})">${t.done?"↩︎":"✓"}</button>
        <button onclick="del(${i})">✕</button>
      </div>`;
    ed.appendChild(row);
  });
}
function startCurrent(){
  const i=curIndex();if(i<0)return;
  tasks[i].startedAt=Date.now();document.getElementById("encourage").textContent="專心完成這一項就好 💪";render();
}
function finishCurrent(){
  const i=curIndex();if(i<0)return;
  const t=tasks[i];if(!t.startedAt)return;
  const mins=Math.max(1,Math.round((Date.now()-t.startedAt)/60000));
  t.actual=mins;t.done=true;t.startedAt=null;stopTimer();
  const diff=(Number(t.plan)||0)-mins;
  const msg=diff>0?`完成！比預計快 ${diff} 分鐘 ⭐`:"完成一項了，很棒 ⭐";
  document.getElementById("encourage").textContent=msg;
  const all=tasks.length&&tasks.every(x=>x.done);
  render();
  if(all){
    const totalActual=tasks.reduce((a,x)=>a+(Number(x.actual)||0),0);
    document.getElementById("completeSub").textContent=`今天共完成 ${tasks.length} 項，實際約 ${totalActual} 分鐘。`;
    document.getElementById("completeScreen").classList.add("show");
  }
}
function closeComplete(){document.getElementById("completeScreen").classList.remove("show")}
function startTimer(){stopTimer();updateTimer();timerHandle=setInterval(updateTimer,1000)}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function updateTimer(){
  const i=curIndex();if(i<0||!tasks[i].startedAt)return;
  const sec=Math.floor((Date.now()-tasks[i].startedAt)/1000);
  document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function addTask(){tasks.push({name:"新作業",plan:15,actual:null,done:false,startedAt:null});render()}
function editName(i,v){tasks[i].name=v.trim()||"未命名項目";render()}
function editPlan(i,v){tasks[i].plan=Math.max(1,Number(v)||1);render()}
function move(i,d){const j=i+d;if(j<0||j>=tasks.length)return;[tasks[i],tasks[j]]=[tasks[j],tasks[i]];render()}
function del(i){if(confirm("刪除這個作業？")){tasks.splice(i,1);render()}}
function toggleDone(i){
  tasks[i].done=!tasks[i].done;
  if(!tasks[i].done){tasks[i].actual=null}
  tasks[i].startedAt=null;render();
}
function resetToday(){
  if(!confirm("清除今天所有完成狀態與實際時間？"))return;
  tasks.forEach(t=>{t.done=false;t.actual=null;t.startedAt=null});render();
}
function newDay(){
  if(!confirm("建立新的一天？作業項目與預計時間會保留，但完成紀錄會清除。"))return;
  tasks.forEach(t=>{t.done=false;t.actual=null;t.startedAt=null});render();
}

function requestParent(){
  if(parentMode){exitParent();return}
  pinAction="enter";
  document.getElementById("pinTitle").textContent="進入家長模式";
  document.getElementById("pinDesc").textContent="輸入 4 位數 PIN。預設為 1234。";
  document.getElementById("pinInput").value="";
  document.getElementById("pinModal").classList.add("show");
  setTimeout(()=>document.getElementById("pinInput").focus(),100);
}
function closePin(){document.getElementById("pinModal").classList.remove("show")}
function confirmPin(){
  const val=document.getElementById("pinInput").value;
  if(pinAction==="enter"){
    if(val===getPin()){parentMode=true;document.body.classList.add("parent");document.getElementById("modeBtn").textContent="⚙️ 家長模式";closePin()}
    else alert("PIN 不正確");
  }else{
    if(/^\d{4}$/.test(val)){localStorage.setItem(PINKEY,val);alert("PIN 已修改");closePin()}
    else alert("請輸入 4 位數字");
  }
}
function changePin(){
  pinAction="change";
  document.getElementById("pinTitle").textContent="修改家長 PIN";
  document.getElementById("pinDesc").textContent="輸入新的 4 位數 PIN。";
  document.getElementById("pinInput").value="";
  document.getElementById("pinModal").classList.add("show");
}
function exitParent(){
  parentMode=false;document.body.classList.remove("parent");document.getElementById("modeBtn").textContent="👦 小朋友模式";
}

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script>
</body>
</html>
